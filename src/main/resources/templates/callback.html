<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Payment status</title>
</head>
<body>
    <main>
        <h1>Payment status</h1>
        <p id="payment-status" role="status" aria-live="polite">Verifying your payment...</p>
    </main>
    <script>
        const statusMessage = document.getElementById("payment-status");
        const orderId = new URLSearchParams(window.location.search).get("orderId");

        if (!orderId || !/^\d+$/.test(orderId)) {
            statusMessage.textContent = "Unable to verify payment: order ID is missing or invalid.";
        } else {
            fetch(`/payments/verify/${encodeURIComponent(orderId)}`, { method: "POST" })
                .then(async (response) => {
                    const message = await response.text();
                    if (!response.ok) {
                        throw new Error(message || "Payment could not be verified.");
                    }
                    statusMessage.textContent = "Payment successful. Your order is confirmed.";
                })
                .catch((error) => {
                    statusMessage.textContent = error.message || "Payment verification failed. Please contact support.";
                });
        }
    </script>
</body>
</html>
