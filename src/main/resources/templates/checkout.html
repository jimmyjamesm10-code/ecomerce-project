<!DOCTYPE html>
<html lang="en">
    <head>
        <link rel="stylesheet" th:href="@{/appstyle.css}">
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=0.8">
        <title>Checkout</title>
    </head>

    <body>
        <div th:replace="~{fragments/navbar :: navbar}"></div>
        <div class="checkout-container">
            <h1 class="checkout-title">Checkout</h1>
            <h2>Order Summary</h2>
            <div id="checkout-items"></div>
            <h2 class="checkout-total">Total: R<span id="checkout-total">0.00</span></h2>
            <button id="place_order">Place Order</button>
        </div>
        <p id="decline"></p>

        <dialog id="login-dialog" aria-labelledby="login-dialog-title">
            <button type="button" id="close-login" aria-label="Close login">&times;</button>
            <h2 id="login-dialog-title">Login</h2>
            <form id="login_form">
                <label for="login-email">Email:</label>
                <input type="email" id="login-email" autocomplete="email" required>
                <br><br>
                <label for="login-password">Password:</label>
                <input type="password" id="login-password" autocomplete="current-password" required>
                <br><br>
                <p id="login-error" class="login-failure-message" role="alert"></p>
                <button type="submit">Login</button>
            </form>
        </dialog>

        <dialog id="checkout-dialog" aria-labelledby="checkout-dialog-title">
            <button type="button" id="close-checkout" aria-label="Close checkout">&times;</button>
            <h2 id="checkout-dialog-title">Delivery Information</h2>
            <form id="checkout-form">
                <label for="name">Full Name:</label>
                <input type="text" id="name" required>
                <br><br>
                <label for="email">Email:</label>
                <input type="email" id="email" required>
                <br><br>
                <label for="address">Delivery Address:</label>
                <textarea id="address" required></textarea>
                <br><br>
                <button type="submit" id="paybutton">Pay With Card</button>
            </form>
        </dialog>

        <script type="module" th:src="@{/checkout.js}"></script>
        <script type="module" th:src="@{/Inventory.js}"></script>
        <script type = "module" th:src="@{/rollingcart.js}"></script>
    </body>
</html>
