<!DOCTYPE html>
<html>
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=0.8">
        <link rel="stylesheet" th:href="@{/appstyle.css}">
    </head>
    <body>
        <div th:replace="~{fragments/navbar :: navbar}"></div>
        <div class = "products">Products</div>

        <dialog id="login-dialog" aria-labelledby="login-dialog-title">
            <button type="button" id="close-login" aria-label="Close login">&times;</button>
            <h2 id="login-dialog-title">Login</h2>
            <form id="login_form">
                <label for="login-email">Email:</label>
                <input type="email" id="login-email" autocomplete="email" required>
                <br><br>
                <label for="login-password">Password:</label>
                <input type="password" id="login-password" autocomplete="current-password" required>
                <br><br>
                <p id="login-error" class="login-failure-message" role="alert"></p>
                <button type="submit">Login</button>
            </form>
        </dialog>

    </body>
    <script type = "module" th:src="@{/product.js}"></script>
    <script type = "module" th:src="@{/app.js}"></script>
    <script type = "module" th:src="@{/cart.js}"></script>
    <script type = "module" th:src="@{/rollingcart.js}"></script>
    <script type = "module" th:src="@{/OrderConstructor.js}"></script>
</html>
